<!doctype html><html><head><meta charset="utf-8"><style>
  :root{ --amber:#F2A93B; --ink:#060E18; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;}
  body{ background:var(--ink); color:#fff; position:relative;
    font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .shot{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:saturate(1.06) contrast(1.04); }
  .shot.tweak{ transform-origin:50% 50%; }
  .scrim{ position:absolute; inset:0; background:
    linear-gradient(180deg, rgba(6,14,24,.62) 0%, rgba(6,14,24,.16) 12%,
      rgba(6,14,24,0) 28%, rgba(6,14,24,.12) 44%, rgba(6,14,24,.70) 65%,
      rgba(6,14,24,.95) 83%, #060E18 100%); }
  .pad{ position:absolute; inset:0; padding:58px 62px 56px;
    display:flex; flex-direction:column; }

  .top{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:13px; opacity:.92; }
  .wordmark{ font-weight:700; font-size:28px; letter-spacing:.01em; }
  .count{ font-family:Consolas,"Courier New",monospace; font-size:24px;
    letter-spacing:.16em; color:rgba(255,255,255,.72); }

  .body{ margin-top:auto; }
  .num{ font-weight:900; font-size:112px; line-height:.82; color:var(--amber);
    letter-spacing:-.04em; margin-bottom:18px; }
  .head{ font-weight:900; font-size:78px; line-height:1.0; letter-spacing:-.028em;
    text-shadow:0 2px 26px rgba(0,0,0,.5); }
  .rule{ width:96px; height:5px; background:var(--amber); border-radius:3px;
    margin:24px 0 22px; }
  .copy{ font-size:33px; line-height:1.38; color:rgba(255,255,255,.9);
    max-width:880px; text-shadow:0 1px 16px rgba(0,0,0,.55); }

  .foot{ margin-top:38px; display:flex; align-items:center; justify-content:space-between;
    border-top:2px solid rgba(255,255,255,.22); padding-top:20px; }
  .foot .tag{ font-size:24px; color:rgba(255,255,255,.74); }
  .swipe{ font-size:25px; font-weight:700; color:var(--amber); letter-spacing:.02em; }

  /* cover */
  .cover .kicker{ font-family:Consolas,"Courier New",monospace; font-size:26px;
    letter-spacing:.2em; color:var(--amber); margin-bottom:26px; }
  .cover .head{ font-size:104px; line-height:.95; letter-spacing:-.035em; }
  .cover .head em{ font-style:normal; color:var(--amber); }
  .cover .copy{ margin-top:28px; font-size:35px; }

  /* cta */
  /* the outro sits on open sky, so the label needs its own ground to read on */
  .cta .kicker{ display:inline-block; font-family:Consolas,"Courier New",monospace;
    font-size:24px; letter-spacing:.2em; color:var(--amber); margin-bottom:24px;
    background:rgba(6,14,24,.62); padding:9px 16px; border-radius:4px; }
  .cta .head{ font-size:92px; line-height:.98; }
  .cta .head em{ font-style:normal; color:var(--amber); }
  .cta .pill{ display:inline-block; margin-top:30px; background:var(--amber); color:#10233C;
    font-weight:800; font-size:30px; letter-spacing:.02em;
    padding:17px 34px; border-radius:100px; }
</style></head>

      <div class="head">install your eSIM before you get on the plane</div>
      <div class="rule"></div>
