<!doctype html><html><head><meta charset="utf-8"><style>
  :root{ --amber:#F2A93B; --ink:#060E18; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;}
  body{ background:var(--ink); color:#fff; position:relative;
    font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .shot{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:saturate(1.06) contrast(1.04); }
  .shot.tweak{ transform-origin:50% 50%; }
  .scrim{ position:absolute; inset:0; background:
    linear-gradient(180deg, rgba(6,14,24,.62) 0%, rgba(6,14,24,.16) 12%,
      rgba(6,14,24,0) 28%, rgba(6,14,24,.12) 44%, rgba(6,14,24,.70) 65%,
      rgba(6,14,24,.95) 83%, #060E18 100%); }
  .pad{ position:absolute; inset:0; padding:82px 88px 80px;
    display:flex; flex-direction:column; }

  .top{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:18px; opacity:.92; }
  .wordmark{ font-weight:700; font-size:40px; letter-spacing:.01em; }
  .count{ font-family:Consolas,"Courier New",monospace; font-size:34px;
    letter-spacing:.16em; color:rgba(255,255,255,.72); }

  .body{ margin-top:auto; }
  .num{ font-weight:900; font-size:159px; line-height:.82; color:var(--amber);
    letter-spacing:-.04em; margin-bottom:26px; }
  .head{ font-weight:900; font-size:111px; line-height:1.0; letter-spacing:-.028em;
    text-shadow:0 3px 37px rgba(0,0,0,.5); }
  .rule{ width:137px; height:7px; background:var(--amber); border-radius:4px;
    margin:34px 0 31px; }
  .copy{ font-size:47px; line-height:1.38; color:rgba(255,255,255,.9);
    max-width:1252px; text-shadow:0 1px 23px rgba(0,0,0,.55); }

  .foot{ margin-top:54px; display:flex; align-items:center; justify-content:space-between;
    border-top:3px solid rgba(255,255,255,.22); padding-top:28px; }
  .foot .tag{ font-size:34px; color:rgba(255,255,255,.74); }
  .swipe{ font-size:36px; font-weight:700; color:var(--amber); letter-spacing:.02em; }

  /* cover */
  .cover .kicker{ font-family:Consolas,"Courier New",monospace; font-size:37px;
    letter-spacing:.2em; color:var(--amber); margin-bottom:37px; }
  .cover .head{ font-size:148px; line-height:.95; letter-spacing:-.035em; }
  .cover .head em{ font-style:normal; color:var(--amber); }
  .cover .copy{ margin-top:40px; font-size:50px; }

  /* cta */
  /* the outro sits on open sky, so the label needs its own ground to read on */
  .cta .kicker{ display:inline-block; font-family:Consolas,"Courier New",monospace;
    font-size:34px; letter-spacing:.2em; color:var(--amber); margin-bottom:34px;
    background:rgba(6,14,24,.62); padding:13px 23px; border-radius:6px; }
  .cta .head{ font-size:131px; line-height:.98; }
  .cta .head em{ font-style:normal; color:var(--amber); }
  .cta .pill{ display:inline-block; margin-top:43px; background:var(--amber); color:#10233C;
    font-weight:800; font-size:43px; letter-spacing:.02em;
    padding:24px 48px; border-radius:142px; }
</style></head>

      <div class="count">08 / 14</div>
    </div><div class="body">
      <div class="num">07</div>
      <div class="head">photograph your bag and its tag at drop off</div>
      <div class="rule"></div>
      <div class="copy">One shot of the bag, one of the barcode sticker. If it goes missing you file the claim with a photo and a tracking number instead of the words 'black, medium, sort of shiny'.</div>
      <div class="foot"><div class="tag">wanderbuddyapp.com</div><div class="swipe">swipe &rarr;</div></div>
    </div></div></body></html>
