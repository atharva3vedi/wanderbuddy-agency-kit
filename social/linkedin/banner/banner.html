<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LinkedIn Banner</title>
<style>
  @font-face { font-family: Inter; font-weight: 700; src: url("../../assets/fonts/Inter-Bold.ttf"); }
  @font-face { font-family: Inter; font-weight: 400; src: url("../../assets/fonts/Inter-Regular.ttf"); }
  @font-face { font-family: Instrument; font-style: italic; src: url("../../assets/fonts/InstrumentSerif-Italic.ttf"); }
  html, body { margin: 0; padding: 0; background: #0E4A7A; }
  /* LinkedIn personal banner: 1584 x 396. Profile photo covers bottom-left,
     so the lockup lives right of x=560. */
  .b {
    position: relative; width: 1584px; height: 396px; overflow: hidden;
    background:
      radial-gradient(900px 500px at 78% 10%, rgba(63,167,230,.45), transparent 60%),
      linear-gradient(115deg, #0B3F6B 0%, #135C97 45%, #1A6FB0 100%);
    font-family: Inter, sans-serif; color: #fff;
  }
  svg.bg { position: absolute; inset: 0; }
  .lockup {
    position: absolute; left: 610px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; gap: 44px;
  }
  .mark { width: 150px; height: 150px; flex: none; }
  .word { font-weight: 700; font-size: 92px; letter-spacing: -3px; line-height: 1; }
  .tag {
    font-family: Instrument, serif; font-style: italic; font-size: 44px;
    color: #CFE6F7; margin-top: 14px; line-height: 1;
  }
  .tag b { font-weight: 400; color: #F0A431; }
  .url {
    position: absolute; right: 56px; bottom: 36px;
    font-size: 22px; letter-spacing: .5px; color: #fff;
    padding: 10px 20px; border-radius: 999px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.22);
  }
</style>
</head>
<body>
<div class="b">
  <svg class="bg" width="1584" height="396" viewBox="0 0 1584 396">
    <!-- faint topo contours -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="2">
      <path d="M-40 330 C 200 250, 380 380, 620 300 S 1040 180, 1300 260 S 1560 360, 1640 300"/>
      <path d="M-40 360 C 220 290, 400 420, 640 340 S 1060 220, 1320 300 S 1580 400, 1640 340"/>
      <path d="M-40 90 C 180 20, 420 140, 700 70 S 1100 -10, 1350 60 S 1560 120, 1640 80"/>
      <path d="M-40 50 C 200 -20, 440 100, 720 30 S 1120 -50, 1370 20"/>
      <path d="M-40 130 C 160 60, 400 180, 680 110 S 1080 30, 1330 100 S 1550 160, 1640 120"/>
    </g>
    <!-- dotted trip route across the top-left, amber stops -->
    <path d="M 60 110 C 180 40, 300 170, 420 95 S 560 40, 600 70"
          fill="none" stroke="#F0A431" stroke-opacity=".75" stroke-width="3"
          stroke-dasharray="2 12" stroke-linecap="round"/>
    <g fill="#F0A431">
      <circle cx="60" cy="110" r="7"/>
      <circle cx="420" cy="95" r="7"/>
    </g>
    <g fill="none" stroke="#F0A431" stroke-width="3">
      <circle cx="60" cy="110" r="15" stroke-opacity=".35"/>
      <circle cx="420" cy="95" r="15" stroke-opacity=".35"/>
    </g>
    <!-- pin at the route end -->
    <path d="M600 70 c -12 0 -21 9 -21 21 c 0 16 21 34 21 34 s 21 -18 21 -34 c 0 -12 -9 -21 -21 -21 z"
          transform="translate(0,-56)" fill="#F0A431"/>
    <circle cx="600" cy="35" r="7" fill="#0E4A7A"/>
  </svg>

  <div class="lockup">
    <!-- brand mark from assets/icon-master.svg (mountains + wave), cropped -->
    <svg class="mark" viewBox="200 200 624 512">
      <polygon points="224,512 404,296 494,422 602,224 800,512" fill="#FFFFFF"/>
      <path d="M 217 620 Q 290 584 364 620 T 512 620 T 660 620 T 807 620 L 807 692 L 217 692 Z" fill="#FFFFFF"/>
    </svg>
    <div>
      <div class="word">WanderBuddy</div>
      <div class="tag">Plan every trip. <b>Remember everything.</b></div>
    </div>
  </div>

  <div class="url">wanderbuddyapp.com</div>
</div>
</body>
</html>
